[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prms-backend"
version = "0.1.0"
description = "Purchasing & Replenishment Management System — backend API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
    "pyjwt>=2.10",
    # Also used by starlette's TestClient, so the project has one HTTP library
    # rather than httpx and httpx2 side by side.
    "httpx2>=2.12",
    # Amazon SP-API (ADR 0011). Wrapped by app/integrations/amazon; its types
    # stop at that boundary.
    "python-amazon-sp-api>=1.9",
    # In-process scheduler for the Amazon ingestion jobs (ADR 0011). 3.x on
    # purpose: 4.x is a rewrite with a different API and no stable release.
    "apscheduler>=3.10,<4",
    # Vendor file ingestion (phase 4+): XLSX reading and multipart uploads.
    # No pandas, ever — every cell is read as str (ADR 0008, risk R2).
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    # Encoding detection for CSV uploads that name no encoding (AC-5.8).
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

# -----------------------------------------------------------------------------
# Ruff — linting and formatting
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [
    "B008", # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# env.py imports app.models purely for its side effect of registering models.
"alembic/env.py" = ["I001"]
# Generated migrations embed SQL predicates as long string literals. Reflowing
# them would change the SQL, so line length is not enforced here.
"alembic/versions/*" = ["E501", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# -----------------------------------------------------------------------------
# mypy — static type checking
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# python-amazon-sp-api ships no type information. Its types stop at the
# anti-corruption layer in app/integrations/amazon, which is fully typed.
[[tool.mypy.overrides]]
module = ["sp_api.*", "apscheduler.*"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live PostgreSQL database",
]
# Warnings are errors, so our own deprecations surface immediately. Third-party
# deprecations we cannot fix are ignored individually rather than by relaxing
# the default — each one is a line we delete when upstream catches up.
filterwarnings = [
    "error",
    # Raised inside starlette.testclient on import. Fixed upstream in starlette,
    # not in the release we pin.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
