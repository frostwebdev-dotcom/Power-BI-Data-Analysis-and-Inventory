# =============================================================================
# Continuous integration.
#
# Four independent test jobs, every push and pull request:
#   storage-windows asynchronous storage updates on Windows PowerShell 5.1
#   backend        ruff format --check, ruff check, mypy (strict), pytest
#                  (unit + integration against a PostgreSQL 16 service)
#   frontend       npm ci, eslint, tsc --noEmit, next build
#   compose-smoke  builds and starts the full Docker Compose stack from a clean
#                  checkout and .env.example, waits for the API to report the
#                  database healthy, applies and checks the Alembic migration,
#                  confirms the web container answers, seeds a development
#                  organization, and runs the Playwright walk-through
#                  (frontend/e2e) against the stack: sign in, vendor, profile,
#                  upload, report, exception, approve, re-import, watchlist,
#                  availability event, audit.
#
# The smoke job is Milestone 1 exit criterion #1 (docs/milestone-1-scope.md
# §4) and, with the walk-through, the exit-gate of docs/acceptance-criteria.md.
# =============================================================================
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the API and web app to Azure staging after tests pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Separate manual runs from push/PR runs; don't cancel an active manual run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  storage-windows:
    name: Storage attachment (Windows PowerShell)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check asynchronous storage updates on Windows PowerShell 5.1
        shell: powershell
        run: ./infra/tests/storage-attachment.test.ps1

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prms
          POSTGRES_PASSWORD: prms
          POSTGRES_DB: prms
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prms -d prms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/integration/conftest.py derives the test database by appending
      # "_test" to this name and creates it itself; the service user is a
      # superuser, so CREATE DATABASE is permitted. Unit tests never read it.
      DATABASE_URL: postgresql+psycopg://prms:prms@localhost:5432/prms
      APP_ENV: ci
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging storage infrastructure
        working-directory: ${{ github.workspace }}
        run: az bicep build --file infra/azure/staging-raw-storage.bicep --stdout > /dev/null

      - name: Validate storage setup script syntax
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in Get-ChildItem ./infra/scripts/*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { $errors | Write-Error; exit 1 }
          }
          & ./infra/tests/storage-attachment.test.ps1
          & ./infra/tests/staging-permissions.test.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: eslint
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

      - name: next build
        run: npm run build

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose --env-file .env -f infra/docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the local Compose environment
        run: |
          cp .env.example .env
          # The API deliberately runs as a non-root container user.  This
          # repository directory is a bind mount in Compose, so make the
          # disposable CI copy writable before Docker starts.  Production
          # storage uses platform-managed ownership instead.
          chmod -R a+rwx storage

      - name: Build and start the stack
        run: $COMPOSE up -d --build

      - name: Wait for the API to report PostgreSQL healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/api/v1/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy after $((i * 2))s:"; cat /tmp/health.json; echo
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy within 120s (last status: ${code:-none})"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: alembic upgrade head
        run: $COMPOSE exec -T api alembic upgrade head

      - name: alembic check
        run: $COMPOSE exec -T api alembic check

      - name: Web container answers
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "web answered after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "web did not answer within 60s"
          exit 1

      - name: Seed the development organization and users
        run: $COMPOSE exec -T api python -m app.cli.seed_dev

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Milestone 1 walk-through (Playwright)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: admin@example.test
        run: npx playwright test

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans
  deploy-staging:
    name: Deploy API and web app to Azure staging
    needs: [backend, frontend, compose-smoke, storage-windows]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_staging &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://ca-prms-web-staging.thankfulground-2dc62bbd.eastus2.azurecontainerapps.io
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: prms-staging-deployment
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: rg-prms-staging
      APP_NAME: ca-prms-api-staging
      ACR_NAME: acrprmsstaginggs
      IMAGE: acrprmsstaginggs-hcgmemete9fshacj.azurecr.io/prms-api:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      REVISION_SUFFIX: gh-${{ github.run_id }}-${{ github.run_attempt }}
      BASE_URL: https://ca-prms-api-staging.thankfulground-2dc62bbd.eastus2.azurecontainerapps.io
      WEB_APP_NAME: ca-prms-web-staging
      WEB_IMAGE: acrprmsstaginggs-hcgmemete9fshacj.azurecr.io/prms-web:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      WEB_BASE_URL: https://ca-prms-web-staging.thankfulground-2dc62bbd.eastus2.azurecontainerapps.io

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Record previous deployment
        run: |
          az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query "{Revision:properties.latestReadyRevisionName,Containers:properties.template.containers[].{Name:name,Image:image}}" \
            --output json
          az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --query "{Revision:properties.latestReadyRevisionName,Containers:properties.template.containers[].{Name:name,Image:image}}" \
            --output json

      - name: Log in to container registry
        run: az acr login --name "$ACR_NAME"

      - name: Build backend image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "$IMAGE" \
            --file backend/Dockerfile \
            backend

      - name: Push backend image
        run: docker push "$IMAGE"

      - name: Build frontend image for the staging API
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=$BASE_URL" \
            --tag "$WEB_IMAGE" \
            --file frontend/Dockerfile \
            frontend

      - name: Push frontend image
        run: docker push "$WEB_IMAGE"

      - name: Deploy the new image
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --container-name prms-api \
            --image "$IMAGE" \
            --min-replicas 1 \
            --max-replicas 1 \
            --revision-suffix "$REVISION_SUFFIX" \
            --output none
          echo "TARGET_REVISION=${APP_NAME}--${REVISION_SUFFIX}" >> "$GITHUB_ENV"

      - name: Wait for the new revision to become ready
        run: |
          bash infra/scripts/wait-containerapp-revision.sh "$RESOURCE_GROUP" "$APP_NAME" "$TARGET_REVISION"

      - name: Check API and database health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            "$BASE_URL/health"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            "$BASE_URL/api/v1/health"

      - name: Verify staging Microsoft sign-in configuration
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            "$BASE_URL/api/v1/auth/config" | \
            python -c 'import json, sys; config = json.load(sys.stdin); assert config["mode"] == "entra", "Staging must use Microsoft sign-in"; assert config.get("tenant_id") and config.get("client_id") and config.get("scope"), "Incomplete sign-in configuration"'

      - name: Deploy the frontend image
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --container-name prms-web \
            --image "$WEB_IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --output none
          bash infra/scripts/wait-containerapp-revision.sh \
            "$RESOURCE_GROUP" "$WEB_APP_NAME" "${WEB_APP_NAME}--${REVISION_SUFFIX}"

      - name: Check frontend and browser CORS access
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 --output /dev/null "$WEB_BASE_URL/"
          headers=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --dump-header - --output /dev/null --request OPTIONS \
            --header "Origin: $WEB_BASE_URL" \
            --header "Access-Control-Request-Method: GET" \
            --header "Access-Control-Request-Headers: authorization" \
            "$BASE_URL/api/v1/products")
          printf '%s\n' "$headers" | tr -d '\r' | \
            grep -Fxi "access-control-allow-origin: $WEB_BASE_URL"

      - name: Deployment summary
        run: |
          {
            echo "### Staging API and web deployment"
            echo "- Commit: $GITHUB_SHA"
            echo "- Image: $IMAGE"
            echo "- Revision: $TARGET_REVISION"
            echo "- URL: $BASE_URL"
            echo "- Web image: $WEB_IMAGE"
            echo "- Web revision: ${WEB_APP_NAME}--${REVISION_SUFFIX}"
            echo "- Web URL: $WEB_BASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
